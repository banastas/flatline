name: Flatline

options:
  bundleIdPrefix: as.banast
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 6
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: F87BNUZAVJ
    DEAD_CODE_STRIPPING: YES
  configs:
    # Local builds stay ad-hoc signed so they work on any machine.
    Debug:
      CODE_SIGN_IDENTITY: "-"
    # Releases are notarized, which needs Developer ID plus a secure timestamp.
    Release:
      CODE_SIGN_IDENTITY: Developer ID Application
      OTHER_CODE_SIGN_FLAGS: --timestamp

packages:
  FlatlineKit:
    path: Packages/FlatlineKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Flatline:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: FlatlineKit
      - package: Sparkle
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleName: flatline
        CFBundleDisplayName: flatline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: © 2026 Bill Anastas
        # Sparkle. Checks daily without asking first; the private half of
        # SUPublicEDKey lives in the release machine's keychain (account "flatline").
        SUFeedURL: https://flatline.banast.as/appcast.xml
        SUPublicEDKey: n40fk0wdEFQuVGL1tzJ10+OzdGC4hvsFUuvFWPSWRP4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: flatline
        PRODUCT_BUNDLE_IDENTIFIER: as.banast.flatline
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
