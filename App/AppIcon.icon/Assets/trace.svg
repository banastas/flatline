<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- One beat on the centre grid line, then flat into a block cursor, lit. The lead-in is dimmed like decaying phosphor.
       One slice (y 630-662) is knocked 34 px to the right. -->
  <defs><clipPath id="band"><rect x="-200" y="630" width="1424" height="32"/></clipPath><clipPath id="outside"><path d="M-200 -200 H1224 V630 H-200 Z M-200 662 H1224 V1224 H-200 Z"/></clipPath><linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="824"><stop offset="0" stop-color="#FBFAF6"/><stop offset="1" stop-color="#E4E2DC"/></linearGradient></defs>
  <g clip-path="url(#outside)"><path d="M158 512 H392" fill="none" stroke="#5C5C5E" stroke-width="64" stroke-linecap="round"/><path d="M392 512 L448 240 L560 784 L616 512 H768" fill="none" stroke="url(#paper)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/><rect x="832" y="412" width="64" height="200" rx="12" fill="#00EDFF"/></g><g clip-path="url(#band)" transform="translate(34 0)"><path d="M158 512 H392" fill="none" stroke="#5C5C5E" stroke-width="64" stroke-linecap="round"/><path d="M392 512 L448 240 L560 784 L616 512 H768" fill="none" stroke="url(#paper)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/><rect x="832" y="412" width="64" height="200" rx="12" fill="#00EDFF"/></g>
</svg>
